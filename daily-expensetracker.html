<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Spendly - Expense Tracker</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#718096;--line:#e8edf4;--accent:#4f46e5;--accent2:#7c3aed;--green:#16a34a;--red:#dc2626}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif}
.app{max-width:560px;margin:auto;padding:14px 13px 34px}
.top{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 16px}.brand{font-size:25px;font-weight:900;letter-spacing:-.7px}.brand span{color:var(--accent)}.tag{font-size:12px;color:var(--muted);margin-top:2px}
.iconbtn{width:42px;height:42px;border-radius:13px;background:#fff;border:1px solid var(--line);font-size:19px}
.card{background:var(--card);border:1px solid #edf0f5;border-radius:20px;padding:15px;margin:11px 0;box-shadow:0 5px 20px rgba(31,41,55,.05)}
.hero{background:linear-gradient(135deg,#111827,#312e81);color:white;border:0;padding:19px}
.hero .muted{color:#cbd5e1}.hero h2{font-size:34px;letter-spacing:-1px;margin:4px 0 14px}.hero-top{display:flex;justify-content:space-between;align-items:start}.month-select{background:#ffffff18;color:white;border:1px solid #ffffff30;height:38px;padding:0 10px;border-radius:10px;font-size:13px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.mini{background:#ffffff12;border:1px solid #ffffff18;border-radius:13px;padding:10px}.mini b{display:block;font-size:17px;margin-top:3px}.muted{font-size:11px;color:var(--muted)}
h3{font-size:16px;margin:0 0 12px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.section-head h3{margin:0}
label{display:block;font-size:10px;font-weight:800;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
input,select{width:100%;height:47px;border:1px solid #dce2eb;border-radius:12px;background:#fff;padding:0 12px;font-size:15px;color:var(--text);outline:none}input:focus,select:focus{border-color:#818cf8;box-shadow:0 0 0 3px #6366f11a}
.date-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.expense-row{display:grid;grid-template-columns:1.2fr 1fr 92px 38px;gap:7px;align-items:end;margin-bottom:9px}
.remove{height:47px;border:0;border-radius:12px;background:#fff1f2;color:var(--red);font-size:19px;font-weight:700}
.add{width:100%;height:53px;border:0;border-radius:14px;background:#eef2ff;color:#4338ca;font-size:16px;font-weight:800;margin-top:2px}.save{width:100%;height:50px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:16px;font-weight:800;margin-top:9px;box-shadow:0 7px 18px #4f46e533}
.day-total{display:flex;justify-content:space-between;align-items:center;background:#f8fafc;border-radius:14px;padding:11px 13px;margin-top:10px}.day-total b{font-size:20px}
.bar{height:9px;background:#eef2f7;border-radius:99px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}.rank{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.rank:last-child{border:0}.rank-num{width:27px;height:27px;border-radius:9px;background:#eef2ff;color:#4338ca;display:grid;place-items:center;font-size:12px;font-weight:800}.rank-main{flex:1;min-width:0}.rank-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rank-amt{font-weight:800;font-size:14px}
.range{display:grid;grid-template-columns:1fr 1fr;gap:9px}.calc{width:100%;height:46px;border:0;border-radius:12px;background:#111827;color:#fff;font-weight:800;margin-top:9px}
.result{background:#f8fafc;border-radius:14px;padding:12px;margin-top:10px}.result-line{display:flex;justify-content:space-between;padding:5px 0;font-size:14px}.result-line strong{font-size:15px}
.day{padding:12px 0;border-top:1px solid var(--line)}.day:first-child{border-top:0}.day-head{display:flex;justify-content:space-between;align-items:center}.day-amount{font-weight:800}.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}.chip{font-size:11px;background:#f1f5f9;padding:5px 7px;border-radius:8px;color:#475569}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tool,.danger{height:42px;border:0;border-radius:11px;font-weight:800}.tool{background:#eef2f7;color:#334155}.danger{width:100%;background:#fff1f2;color:#be123c;margin-top:8px}
.empty{text-align:center;color:var(--muted);padding:15px;font-size:13px}.tip{font-size:11px;color:var(--muted);line-height:1.5;margin-top:9px}
@media(max-width:480px){.expense-row{grid-template-columns:1fr 82px 38px}.expense-row>div:first-child{grid-column:1/3}.expense-row>div:nth-child(2){grid-column:1/2}.expense-row>div:nth-child(3){grid-column:2/3}.expense-row .remove{grid-column:3;grid-row:2}}
</style>
</head>
<body>
<div class="app">
<div class="top"><div><div class="brand">Spend<span>ly</span></div><div class="tag">Know where your money goes.</div></div><button class="iconbtn" onclick="scrollTo({top:document.body.scrollHeight,behavior:'smooth'})">⚙️</button></div>

<div class="card hero">
<div class="hero-top"><div><div class="muted">THIS MONTH</div><h2 id="monthTotal">₹0</h2></div><input class="month-select" id="month" type="month"></div>
<div class="stats"><div class="mini"><span class="muted">DAILY AVERAGE</span><b id="monthAvg">₹0</b></div><div class="mini"><span class="muted">ACTIVE DAYS</span><b id="activeDays">0</b></div></div>
</div>

<div class="card">
<div class="section-head"><h3>Quick expense</h3><span class="muted">Today</span></div>
<div class="date-row"><div><label>Date</label><input id="date" type="date"></div><div><label>Day total</label><input id="quickTotal" value="₹0" readonly></div></div>
</div>

<div class="card">
<div id="expenses"></div>
<button class="add" type="button" onclick="addExpense()">＋ Add expense</button>
<button class="save" type="button" onclick="saveDay()">Save expenses</button>
<div class="day-total"><span>Selected day total</span><b id="dayTotal">₹0</b></div>
<div class="tip">Tip: enter the item name so the dashboard can learn what you purchase most.</div>
</div>

<div class="card">
<div class="section-head"><h3>📊 Spending insights</h3><span class="muted" id="insightMonth"></span></div>
<div id="dashboard"></div>
</div>

<div class="card">
<h3>📅 Compare any period</h3>
<div class="range"><div><label>From</label><input id="fromDate" type="date"></div><div><label>To</label><input id="toDate" type="date"></div></div>
<button class="calc" onclick="calculateRange()">Calculate spending</button>
<div id="rangeResult"></div>
</div>

<div class="card">
<div class="section-head"><h3>Recent days</h3><span class="muted">Saved locally</span></div>
<div id="history"></div>
</div>

<div class="card">
<h3>Data & backup</h3>
<div class="tools"><button class="tool" onclick="exportBackup()">Export backup</button><button class="tool" onclick="document.getElementById('file').click()">Restore backup</button></div>
<input id="file" type="file" accept=".json" hidden onchange="restoreBackup(event)">
<button class="danger" onclick="deleteAll()">Delete all data</button>
</div>
</div>

<script>
const CATEGORIES=["Food & Dining","Groceries","Travel & Fuel","Home","Bills","Shopping","Entertainment","Health","EMI / Loan","Education","Other"];
const KEY="spendlyExpenseTrackerV2";let data={};
try{data=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){data={}}
const $=id=>document.getElementById(id);
function today(){let d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
function money(v){return "₹"+Number(v||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2})}
function fmt(d){let [y,m,x]=d.split("-");return x+"-"+m+"-"+y}
function persist(){localStorage.setItem(KEY,JSON.stringify(data))}
function opts(selected=""){return '<option value="">Select category</option>'+CATEGORIES.map(c=>'<option '+(c===selected?'selected':'')+'>'+c+'</option>').join("")}

function addExpense(item="",category="",amount=""){
 const box=$("expenses"),r=document.createElement("div");r.className="expense-row";
 r.innerHTML='<div><label>Item</label><input class="item" placeholder="e.g. Petrol, Rice, Coffee" value="'+esc(item)+'"></div><div><label>Category</label><select class="category">'+opts(category)+'</select></div><div><label>Amount</label><input class="amount" type="number" min="0" step="0.01" inputmode="decimal" placeholder="₹" value="'+amount+'"></div><button class="remove" type="button">×</button>';
 box.appendChild(r);r.querySelector(".remove").onclick=()=>{r.remove();updateDay()};r.querySelector(".amount").oninput=updateDay;r.querySelector(".category").onchange=updateDay;r.querySelector(".item").oninput=updateDay;updateDay()
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function rows(){return [...document.querySelectorAll(".expense-row")].map(r=>({item:r.querySelector(".item").value.trim(),category:r.querySelector(".category").value,amount:Number(r.querySelector(".amount").value||0)})).filter(x=>x.amount>0)}
function sum(r){return r.reduce((a,x)=>a+x.amount,0)}
function updateDay(){let v=sum(rows());$("dayTotal").textContent=money(v);$("quickTotal").value=money(v)}
function saveDay(){let d=$("date").value,r=rows();if(!d)return alert("Select a date.");if(!r.length)return alert("Add an expense.");data[d]={expenses:r};persist();renderHistory();updateMonth();alert("Saved ✓")}
function loadDay(d){$("expenses").innerHTML="";if(data[d]?.expenses?.length)data[d].expenses.forEach(x=>addExpense(x.item||"",x.category||"",x.amount));else addExpense();updateDay()}
function updateMonth(){
 let m=$("month").value,total=0,days=0,items={},cats={};
 Object.keys(data).forEach(d=>{if(d.startsWith(m)){let r=data[d].expenses||[],a=sum(r);total+=a;if(a>0)days++;r.forEach(x=>{let n=x.item||"Unnamed item";items[n]=(items[n]||0)+x.amount;cats[x.category||"Other"]=(cats[x.category||"Other"]||0)+x.amount})}});
 $("monthTotal").textContent=money(total);$("monthAvg").textContent=money(days?total/days:0);$("activeDays").textContent=days;$("insightMonth").textContent=m;
 const topItems=Object.entries(items).sort((a,b)=>b[1]-a[1]).slice(0,5),topCats=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,5);
 let h="";
 if(topItems.length){h+='<div class="muted" style="font-weight:800;margin-bottom:2px">TOP PURCHASES</div>';let max=topItems[0][1];h+=topItems.map((x,i)=>'<div class="rank"><div class="rank-num">'+(i+1)+'</div><div class="rank-main"><div class="rank-name">'+esc(x[0])+'</div><div class="bar"><i style="width:'+Math.max(7,x[1]/max*100)+'%"></i></div></div><div class="rank-amt">'+money(x[1])+'</div></div>').join("")}
 if(topCats.length){h+='<div class="muted" style="font-weight:800;margin:15px 0 2px">TOP CATEGORIES</div>';h+=topCats.map(x=>'<div class="result-line"><span>'+esc(x[0])+'</span><strong>'+money(x[1])+'</strong></div>').join("")}
 $("dashboard").innerHTML=h||'<div class="empty">Start adding expenses to see your spending insights.</div>';
}
function calculateRange(){let f=$("fromDate").value,t=$("toDate").value;if(!f||!t||f>t)return $("rangeResult").innerHTML='<div class="empty">Select valid dates.</div>';let amount=0,days=0;Object.keys(data).filter(d=>d>=f&&d<=t).forEach(d=>{let a=sum(data[d].expenses||[]);amount+=a;if(a)days++});$("rangeResult").innerHTML='<div class="result"><div class="result-line"><span>Total spending</span><strong>'+money(amount)+'</strong></div><div class="result-line"><span>Active days</span><strong>'+days+'</strong></div><div class="result-line"><span>Average active day</span><strong>'+money(days?amount/days:0)+'</strong></div></div>'}
function renderHistory(){let ds=Object.keys(data).sort().reverse();if(!ds.length)return $("history").innerHTML='<div class="empty">No saved days yet.</div>';$("history").innerHTML=ds.slice(0,20).map(d=>{let r=data[d].expenses||[];return '<div class="day"><div class="day-head"><strong>'+fmt(d)+'</strong><span class="day-amount">'+money(sum(r))+'</span></div><div class="chips">'+r.map(x=>'<span class="chip">'+esc(x.item||x.category)+' · '+money(x.amount)+'</span>').join("")+'</div></div>'}).join("")}
function exportBackup(){let b=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="daily-expense-tracker-backup.json";a.click();URL.revokeObjectURL(a.href)}
function restoreBackup(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=x=>{try{data=JSON.parse(x.target.result);persist();loadDay($("date").value);renderHistory();updateMonth();alert("Backup restored ✓")}catch(err){alert("Invalid backup file.")}};r.readAsText(f)}
function deleteAll(){if(confirm("Delete all saved expense data?")){data={};persist();loadDay($("date").value);renderHistory();updateMonth()}}
let t=today();$("date").value=t;$("month").value=t.slice(0,7);$("fromDate").value=t;$("toDate").value=t;
$("date").onchange=e=>loadDay(e.target.value);$("month").onchange=updateMonth;loadDay(t);renderHistory();updateMonth();
</script>
</body>
</html>
