<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Cigarette Daily Tracker</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#111827}
.app{max-width:520px;margin:auto;padding:14px 12px 30px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h1{font-size:21px;margin:0}.date{font-size:13px;color:#6b7280;margin-top:3px}
.card{background:#fff;border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 2px 9px #0000000b}
label{font-size:11px;font-weight:800;color:#6b7280;display:block;margin-bottom:6px}
input,select{width:100%;height:46px;border:1px solid #d1d5db;border-radius:11px;padding:0 12px;font-size:16px;background:#fff}
button{border:0;border-radius:12px;font-size:16px;font-weight:800;cursor:pointer}
.add{width:100%;height:58px;background:#111827;color:white;font-size:19px;margin-top:8px}
.save{width:100%;height:48px;background:#16a34a;color:#fff;margin-top:10px}
.row{display:grid;grid-template-columns:1fr 100px;gap:9px;align-items:end;margin-bottom:10px}
.remove{height:46px;background:#fee2e2;color:#991b1b;font-size:20px}
.countbox{text-align:center;background:#f9fafb;border-radius:12px;padding:12px;margin-top:10px}
.countbox b{font-size:29px;display:block}.money{font-size:17px;margin-top:3px}
.range{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.calc{width:100%;height:48px;background:#111827;color:#fff;margin-top:10px}
.result{margin-top:12px;background:#f9fafb;border-radius:12px;padding:12px}
.stat{display:flex;justify-content:space-between;padding:5px 0}.stat b{font-size:17px}
.history h2{font-size:16px;margin:0 0 8px}.day{border-top:1px solid #e5e7eb;padding:10px 0}.day:first-child{border-top:0}
.dayline{display:flex;justify-content:space-between}.small{font-size:12px;color:#6b7280;margin-top:3px}
.empty{text-align:center;color:#6b7280;padding:12px}.tools{display:flex;gap:8px}.tool{flex:1;height:42px;background:#e5e7eb;font-size:13px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><h1>🚬 Daily Tracker</h1><div class="date" id="dateText"></div></div>
  </div>

  <div class="card">
    <label>DATE</label>
    <input id="date" type="date">
  </div>

  <div class="card">
    <div id="items"></div>
    <button class="add" type="button" id="add">＋ Add Cigarette Count</button>
    <button class="save" type="button" id="save">Save Today</button>
    <div class="countbox">
      <div class="small">TODAY'S TOTAL</div>
      <b id="totalCount">0</b>
      <div class="money" id="totalMoney">₹0.00</div>
    </div>
  </div>

  <div class="card">
    <label>CALCULATE BETWEEN DATES</label>
    <div class="range">
      <input id="from" type="date"><input id="to" type="date">
    </div>
    <button class="calc" type="button" id="calculate">Calculate</button>
    <div id="result"></div>
  </div>

  <div class="card history">
    <h2>Saved Days</h2>
    <div id="history"></div>
  </div>

  <div class="card">
    <div class="tools">
      <button class="tool" id="export">Backup</button>
      <button class="tool" id="importBtn">Restore</button>
      <button class="tool" id="delete">Delete All</button>
    </div>
    <input id="file" type="file" accept=".json" hidden>
  </div>
</div>

<script>
const KEY="cigarette_tracker_v2";
const BRANDS={
 "Gold Flake Kings":17,
 "Gold Flake Lights":17,
 "Classic Milds":20,
 "Classic Regular":20,
 "Classic Ultra":20,
 "Classic Connect":20,
 "Wills Navy Cut":17,
 "Four Square":12,
 "Navy Cut":17,
 "Marlboro":20,
 "Marlboro Advance":20,
 "Marlboro Gold":20,
 "Parliament":25,
 "Other":0
};
let data={};
try{data=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){data={}}
const $=id=>document.getElementById(id);
function today(){let d=new Date();d=new Date(d-d.getTimezoneOffset()*60000);return d.toISOString().slice(0,10)}
function money(n){return "₹"+Number(n||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2})}
function fmt(d){let [y,m,x]=d.split("-");return x+"-"+m+"-"+y}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function brandOptions(selected=""){return '<option value="">Select brand</option>'+Object.entries(BRANDS).map(([b,p])=>`<option value="${b}" ${b===selected?"selected":""}>${b}${p?" — ₹"+p:""}</option>`).join("")}
function addRow(item={brand:"",count:1}){
 const r=document.createElement("div");r.className="row";
 r.innerHTML=`<div><label>BRAND</label><select class="brand">${brandOptions(item.brand)}</select></div>
 <div><label>COUNT</label><input class="count" type="number" min="1" step="1" inputmode="numeric" value="${item.count||1}"></div>
 <button class="remove" type="button">×</button>`;
 $("items").appendChild(r);
 r.querySelector(".remove").onclick=()=>{r.remove();update()};
 r.querySelector(".brand").onchange=update;r.querySelector(".count").oninput=update;
}
function rows(){return [...document.querySelectorAll(".row")].map(r=>({brand:r.querySelector(".brand").value,count:Number(r.querySelector(".count").value||0)})).filter(x=>x.brand&&x.count>0)}
function totals(rs){return rs.reduce((a,x)=>{let price=BRANDS[x.brand]||0;a.count+=x.count;a.amount+=x.count*price;return a},{count:0,amount:0})}
function update(){let t=totals(rows());$("totalCount").textContent=t.count;$("totalMoney").textContent=money(t.amount)}
function load(d){
 $("items").innerHTML="";
 if(data[d]&&data[d].items.length)data[d].items.forEach(addRow);else addRow();
 update();$("dateText").textContent=fmt(d);
}
function saveDay(){
 let d=$("date").value,rs=rows();
 if(!d||!rs.length){alert("Select a brand and enter count.");return}
 data[d]={items:rs};save();renderHistory();alert("Saved!");
}
function renderHistory(){
 let ds=Object.keys(data).sort().reverse();
 $("history").innerHTML=ds.length?ds.map(d=>{let t=totals(data[d].items);return `<div class="day"><div class="dayline"><b>${fmt(d)}</b><b>${t.count} • ${money(t.amount)}</b></div><div class="small">${data[d].items.map(x=>x.brand+" × "+x.count).join(", ")}</div></div>`}).join(""):'<div class="empty">No saved days</div>';
}
function calculate(){
 let f=$("from").value,t=$("to").value;
 if(!f||!t||f>t){$("result").innerHTML='<div class="empty">Select valid dates.</div>';return}
 let all=[];
 Object.keys(data).filter(d=>d>=f&&d<=t).forEach(d=>all.push(...data[d].items));
 let x=totals(all);
 $("result").innerHTML=`<div class="result"><div class="stat"><span>Total Cigarettes</span><b>${x.count}</b></div><div class="stat"><span>Total Amount</span><b>${money(x.amount)}</b></div><div class="small">${fmt(f)} to ${fmt(t)}</div></div>`;
}
$("add").onclick=()=>{addRow();update()};
$("save").onclick=saveDay;$("calculate").onclick=calculate;
$("date").onchange=()=>load($("date").value);
$("export").onclick=()=>{let b=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="cigarette-tracker-backup.json";a.click()};
$("importBtn").onclick=()=>$("file").click();
$("file").onchange=e=>{let r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);save();load($("date").value);renderHistory();alert("Restored")}catch(x){alert("Invalid backup")}};r.readAsText(e.target.files[0])};
$("delete").onclick=()=>{if(confirm("Delete all saved data?")){data={};save();load($("date").value);renderHistory()}};
let d=today();$("date").value=d;$("from").value=d;$("to").value=d;load(d);renderHistory();
</script>
</body>
</html>
